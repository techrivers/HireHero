services:
  web:
    build: .
    ports:
      - "9000:9000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    networks:
      - cv-matcher-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3002"
    environment:
      - REACT_APP_API_URL=http://localhost:9000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - web
    networks:
      - cv-matcher-network

# volumes:
  # postgres_data:  # No longer needed with Supabase

networks:
  cv-matcher-network:
    driver: bridge
